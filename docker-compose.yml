services:
  mysql:
    image: mysql:8.4
    container_name: agenda_ai_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-agenda_ai}
      MYSQL_USER: ${DB_USER:-agenda}
      MYSQL_PASSWORD: ${DB_PASSWORD:-agenda_secret}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - agenda_ai_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenda_ai_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  agenda_ai_mysql_data:
